<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)"/>
  
  <!-- Nursery symbol - Baby face with smile -->
  <circle cx="50" cy="45" r="25" fill="#ffffff"/>
  
  <!-- Eyes -->
  <circle cx="42" cy="42" r="3" fill="#667eea"/>
  <circle cx="58" cy="42" r="3" fill="#667eea"/>
  
  <!-- Smile -->
  <path d="M 38 50 Q 50 58 62 50" stroke="#667eea" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Heart accent -->
  <path d="M 50 70 L 45 65 Q 42 62 45 59 Q 48 56 50 59 Q 52 56 55 59 Q 58 62 55 65 Z" fill="#ff6b9d"/>
</svg>
