name: 🧪 Post-Deploy UI & Icons QA Test

on:
  workflow_run:
    workflows: ["🚀 Render Auto Deploy"]
    types: [completed]
  workflow_dispatch:

jobs:
  qa-test:
    name: 🔍 Verify Frontend & Icon Rendering
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: 🧩 Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧰 Setup environment
        run: |
          echo "Setting up test environment..."
          which curl || sudo apt-get update && sudo apt-get install -y curl

      - name: 🩺 Run comprehensive QA test
        run: |
          echo "🔍 Running QA tests on deployed site..."
          
          BASE_URL="https://nursery-management-system-dari-alhanonah.onrender.com"
          
          # Create QA Report Header
          cat > QA-TEST-REPORT.md << 'HEADER'
          # 🧪 Automated QA Test Report
          
          **Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Deployment URL:** https://nursery-management-system-dari-alhanonah.onrender.com
          **Workflow Run:** ${{ github.run_number }}
          
          ---
          
          ## 📊 Test Results
          
          HEADER
          
          # Wait for Render to be fully deployed
          echo "⏳ Waiting 30 seconds for Render deployment to stabilize..."
          sleep 30
          
          # Test basic connectivity
          echo "" >> QA-TEST-REPORT.md
          echo "### 🌍 Site Availability" >> QA-TEST-REPORT.md
          echo "" >> QA-TEST-REPORT.md
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ **Site is reachable** (HTTP $STATUS)" >> QA-TEST-REPORT.md
          else
            echo "❌ **Site is not reachable** (HTTP $STATUS)" >> QA-TEST-REPORT.md
          fi
          
          # Test all routes
          echo "" >> QA-TEST-REPORT.md
          echo "### 🔗 Route Testing" >> QA-TEST-REPORT.md
          echo "" >> QA-TEST-REPORT.md
          echo "| Route | Status | HTTP Code |" >> QA-TEST-REPORT.md
          echo "|-------|--------|-----------|" >> QA-TEST-REPORT.md
          
          declare -A ROUTES=(
            [Homepage]="/"
            [Dashboard]="/dashboard"
            [Students]="/students"
            [Teachers]="/teachers"
            [Attendance]="/attendance"
            [Behavior]="/behavior"
            [Reports]="/reports"
            [Settings]="/settings"
          )
          
          TOTAL=0
          PASSED=0
          
          for NAME in "${!ROUTES[@]}"; do
            URL="${BASE_URL}${ROUTES[$NAME]}"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            TOTAL=$((TOTAL + 1))
            
            if [ "$STATUS" = "200" ]; then
              echo "| $NAME | ✅ Pass | $STATUS |" >> QA-TEST-REPORT.md
              PASSED=$((PASSED + 1))
            elif [ "$STATUS" = "302" ] || [ "$STATUS" = "301" ]; then
              echo "| $NAME | ⚠️ Redirect | $STATUS |" >> QA-TEST-REPORT.md
            else
              echo "| $NAME | ❌ Fail | $STATUS |" >> QA-TEST-REPORT.md
            fi
          done
          
          # Check FontAwesome
          echo "" >> QA-TEST-REPORT.md
          echo "### 🎨 Icon Library Verification" >> QA-TEST-REPORT.md
          echo "" >> QA-TEST-REPORT.md
          
          HTML=$(curl -s "$BASE_URL" || echo "")
          
          if echo "$HTML" | grep -q "font-awesome"; then
            echo "✅ **FontAwesome CDN detected**" >> QA-TEST-REPORT.md
            
            # Extract version if possible
            VERSION=$(echo "$HTML" | grep -o "font-awesome/[0-9.]*" | head -1)
            if [ -n "$VERSION" ]; then
              echo "   - Version: \`$VERSION\`" >> QA-TEST-REPORT.md
            fi
          else
            echo "❌ **FontAwesome CDN not found**" >> QA-TEST-REPORT.md
            echo "   - **Action Required:** Icons may not render correctly" >> QA-TEST-REPORT.md
          fi
          
          # Check for icon classes
          if echo "$HTML" | grep -q "fa-solid\|fa-regular\|fa-brands"; then
            echo "✅ **FontAwesome classes detected in HTML**" >> QA-TEST-REPORT.md
          fi
          
          # Check manifest.json
          echo "" >> QA-TEST-REPORT.md
          echo "### 📱 PWA Manifest Check" >> QA-TEST-REPORT.md
          echo "" >> QA-TEST-REPORT.md
          
          MANIFEST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${BASE_URL}/manifest.json" || echo "000")
          if [ "$MANIFEST_STATUS" = "200" ]; then
            echo "✅ **Manifest.json is accessible** (HTTP $MANIFEST_STATUS)" >> QA-TEST-REPORT.md
          else
            echo "⚠️ **Manifest.json not found** (HTTP $MANIFEST_STATUS)" >> QA-TEST-REPORT.md
          fi
          
          # Check favicon
          FAVICON_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${BASE_URL}/favicon.svg" || echo "000")
          if [ "$FAVICON_STATUS" = "200" ]; then
            echo "✅ **Favicon is accessible** (HTTP $FAVICON_STATUS)" >> QA-TEST-REPORT.md
          else
            echo "⚠️ **Favicon not found** (HTTP $FAVICON_STATUS)" >> QA-TEST-REPORT.md
          fi
          
          # Summary
          echo "" >> QA-TEST-REPORT.md
          echo "### 📈 Summary" >> QA-TEST-REPORT.md
          echo "" >> QA-TEST-REPORT.md
          echo "- **Total Routes Tested:** $TOTAL" >> QA-TEST-REPORT.md
          echo "- **Passed:** $PASSED" >> QA-TEST-REPORT.md
          echo "- **Failed:** $((TOTAL - PASSED))" >> QA-TEST-REPORT.md
          
          PASS_RATE=$((PASSED * 100 / TOTAL))
          echo "- **Pass Rate:** ${PASS_RATE}%" >> QA-TEST-REPORT.md
          
          # Final status
          echo "" >> QA-TEST-REPORT.md
          if [ "$PASS_RATE" -ge 50 ]; then
            echo "✅ **Overall Status:** PASS" >> QA-TEST-REPORT.md
          else
            echo "⚠️ **Overall Status:** NEEDS ATTENTION" >> QA-TEST-REPORT.md
          fi
          
          # Footer
          echo "" >> QA-TEST-REPORT.md
          echo "---" >> QA-TEST-REPORT.md
          echo "" >> QA-TEST-REPORT.md
          echo "*This report was automatically generated by GitHub Actions*" >> QA-TEST-REPORT.md
          echo "*Workflow: Post-Deploy UI & Icons QA Test*" >> QA-TEST-REPORT.md
          echo "*Run ID: ${{ github.run_id }}*" >> QA-TEST-REPORT.md
          
          echo ""
          echo "✅ QA Test completed"
          echo ""
          echo "📊 Results:"
          echo "   Total: $TOTAL"
          echo "   Passed: $PASSED"
          echo "   Pass Rate: ${PASS_RATE}%"

      - name: 📋 Display QA Report
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 QA Test Report Preview:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cat QA-TEST-REPORT.md
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 💾 Commit QA report
        run: |
          git config user.name "Render QA Bot"
          git config user.email "qa-bot@github-actions"
          git add QA-TEST-REPORT.md
          git diff --staged --quiet || git commit -m "docs: automated QA report [skip ci]" || echo "No changes to commit"

      - name: 🚀 Push QA report
        if: success()
        run: |
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed, may need to pull first"

      - name: 📊 Create summary
        if: always()
        run: |
          echo "### 🧪 QA Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat QA-TEST-REPORT.md >> $GITHUB_STEP_SUMMARY
